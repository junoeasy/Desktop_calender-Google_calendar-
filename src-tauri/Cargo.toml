[package]
name = "desktop-calendar"
version = "0.1.0"
description = "Transparent desktop calendar for Google Calendar and Tasks"
authors = ["Desktop Calendar"]
edition = "2021"

[lib]
name = "desktop_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
webbrowser = "1"
chrono = { version = "0.4", features = ["serde"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
